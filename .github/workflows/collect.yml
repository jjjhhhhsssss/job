name: 채용공고 매일 수집

on:
  schedule:
    - cron: "5 15 * * *" # 매일 한국시간 00:05 (UTC 15:05)
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 공고 수집
        run: node scripts/collect.mjs

      - name: 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "채용공고 데이터 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
